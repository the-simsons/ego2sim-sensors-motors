/ego2sim/serial_bridge:
  ros__parameters:
    port: /dev/ttyACM0
    stale_timeout_s: 1.0
    ack_timeout_s: 2.0
    servo_min: 0.0
    servo_max: 3.141592653589793
    move_max: 62.83185307179586   # firmware: +/-3600 degrees
    velocity_max: 10.471975511965978  # firmware: +/-100 RPM
    # Firmware conversion constants in main.ino accepted as-is (set false to suppress).
    flex_calibration_verified: true
    light_calibration_verified: true
    ir_calibration_verified: true
    tof_min_m: 0.04
    tof_max_m: 1.3
    tof_fov_rad: 0.47123889803846897
    ir_fov_rad: .nan
    sonar_fov_rad: .nan
/ego2sim/sensor_processing:
  ros__parameters:
    # Optional host_processing:=true only. Default uses firmware physical/filtered data.
    filter_tau_s: 0.2
    filter_stale_s: 1.0
    sonar_us_per_inch: 147.0
    ir_fov_rad: .nan
    sonar_fov_rad: .nan
    # Measured float pairs: flex_adc/flex_angle_rad, light_voltage/light_lux,
    # ir_voltage/ir_distance_m. Inputs strictly increasing; no extrapolation.
